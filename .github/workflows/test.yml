name: test

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m mass_production_quality_validation examples/synthetic_portfolio.json --as-of 2026-08-31 --pretty
      - run: python -m pip install setuptools
      - run: python -m pip install -e . --no-build-isolation
      - run: mass-production-quality-validation examples/synthetic_portfolio.json --as-of 2026-08-31 --pretty
