[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mass-production-quality-validation"
version = "0.1.0"
description = "Local-first OQC data engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "openpyxl==3.1.5",
  "pillow==12.3.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.52",
  "uvicorn==0.52.3"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "hypothesis==6.165.9",
  "mypy==2.3.1",
  "pip-tools==7.6.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.3"
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
markers = [
  "required_test_id(test_id): stable regression contract identifier"
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
packages = ["app"]
plugins = ["pydantic.mypy"]
